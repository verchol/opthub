User tinyproxy
Group tinyproxy
Port 8888
Timeout 600

# Reachable only from the sandbox network; nothing is published to the host.
Allow 0.0.0.0/0

# The allowlist. FilterDefaultDeny inverts the usual sense of the file: what is
# listed is permitted and everything else is refused.
Filter "/etc/tinyproxy/filter"
FilterDefaultDeny On
# FilterType ere = extended regex (FilterExtended is deprecated).
# No trailing comments anywhere in this file: tinyproxy 1.11 rejects them.
FilterType ere
FilterURLs Off

# CONNECT is how https gets through a forward proxy. Only 443, so the proxy
# cannot be turned into a general-purpose tunnel.
ConnectPort 443

LogLevel Notice
DisableViaHeader On
